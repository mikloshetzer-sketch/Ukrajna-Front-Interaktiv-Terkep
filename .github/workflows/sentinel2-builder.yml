name: Sentinel-2 Image Builder

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitude / szélesség"
        required: true
        default: "48.527"
      lon:
        description: "Longitude / hosszúság"
        required: true
        default: "37.706"
      radius_km:
        description: "Radius in km / sugár km-ben"
        required: true
        default: "10"

  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write

jobs:
  build-sentinel2-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve target coordinates
        id: target
        run: |
          LAT="${{ github.event.inputs.lat }}"
          LON="${{ github.event.inputs.lon }}"
          RADIUS_KM="${{ github.event.inputs.radius_km }}"

          if [ -z "$LAT" ]; then
            LAT="48.527"
          fi

          if [ -z "$LON" ]; then
            LON="37.706"
          fi

          if [ -z "$RADIUS_KM" ]; then
            RADIUS_KM="10"
          fi

          echo "lat=$LAT" >> "$GITHUB_OUTPUT"
          echo "lon=$LON" >> "$GITHUB_OUTPUT"
          echo "radius_km=$RADIUS_KM" >> "$GITHUB_OUTPUT"

          echo "Selected target:"
          echo "LAT=$LAT"
          echo "LON=$LON"
          echo "RADIUS_KM=$RADIUS_KM"

      - name: Download Sentinel-2 image
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
        run: |
          python scripts/update_sentinel2.py \
            --lat "${{ steps.target.outputs.lat }}" \
            --lon "${{ steps.target.outputs.lon }}" \
            --radius-km "${{ steps.target.outputs.radius_km }}"

      - name: Verify generated files
        run: |
          echo "Satellite directory:"
          find docs/data/satellite -maxdepth 5 -type f -print

          echo "Latest image:"
          ls -lh docs/data/satellite/sentinel2/latest.png

          echo "History images:"
          ls -lh docs/data/satellite/sentinel2/history/ || true

      - name: Commit generated Sentinel-2 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/satellite/satellite-metadata.json
          git add -f docs/data/satellite/sentinel2/latest.png
          git add -f docs/data/satellite/sentinel2/history/*.png

          git status --short

          if git diff --cached --quiet; then
            echo "No Sentinel-2 changes to commit."
          else
            git commit -m "Update Sentinel-2 imagery"
            git push
          fi
