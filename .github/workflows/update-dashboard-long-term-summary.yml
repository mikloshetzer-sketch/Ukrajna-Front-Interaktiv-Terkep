name: Update dashboard long-term summary

on:
  workflow_dispatch:
  schedule:
    - cron: "25 7 * * *"
  push:
    paths:
      - "data/**"
      - "scripts/build_dashboard_long_term_summary.py"

permissions:
  contents: write

jobs:
  build-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build long-term dashboard summary
        run: python scripts/build_dashboard_long_term_summary.py

      - name: Commit updated summary
        run: |
          if git diff --quiet -- data/dashboard_long_term_summary.json; then
            echo "No summary changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_long_term_summary.json
          git commit -m "Update dashboard long-term summary"
          git push
