name: Black Bird daily public comparison

on:
  workflow_run:
    workflows: ["Update Black Bird map snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: blackbird-daily-comparison
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest and preceding archived snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/blackbird/current /tmp/blackbird/previous
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("blackbird-snapshot-"))) | [.created_at, (.workflow_run.id | tostring), .name] | @tsv' \
            | sort -r | head -n 2 > /tmp/blackbird/snapshots.tsv
          if [ ! -s /tmp/blackbird/snapshots.tsv ]; then
            echo "No available Black Bird snapshots. Run collector first." >&2
            exit 1
          fi
          n=0
          while IFS=$'\t' read -r created_at run_id artifact_name; do
            if [ "$n" -eq 0 ]; then dest=current; else dest=previous; fi
            gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir "/tmp/blackbird/$dest"
            found=$(find "/tmp/blackbird/$dest" -type f -name '*.geojson.gz' -print -quit)
            if [ -z "$found" ]; then
              echo "Missing GeoJSON snapshot in artifact $artifact_name" >&2
              exit 1
            fi
            if [ "$found" != "/tmp/blackbird/$dest/snapshot.geojson.gz" ]; then
              mv "$found" "/tmp/blackbird/$dest/snapshot.geojson.gz"
            fi
            n=$((n + 1))
          done < /tmp/blackbird/snapshots.tsv
      - name: Compare and create dated public metadata
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          if [ -f /tmp/blackbird/previous/snapshot.geojson.gz ]; then
            python scripts/compare_blackbird_daily.py --current /tmp/blackbird/current/snapshot.geojson.gz --previous /tmp/blackbird/previous/snapshot.geojson.gz --date "$DATE"
          else
            python scripts/compare_blackbird_daily.py --current /tmp/blackbird/current/snapshot.geojson.gz --date "$DATE"
          fi
      - name: Commit dated public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/blackbird_history/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Black Bird daily comparison metadata'
            git pull --rebase origin main
            git push origin main
          fi
