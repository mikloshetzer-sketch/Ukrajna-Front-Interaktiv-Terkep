name: Generate Ukraine Frontline PDF Reports

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Jelentés nyelve"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - hu
          - en
      report_date:
        description: "Opcionális dátum YYYY-MM-DD formában; üresen automatikus"
        required: false
        default: ""
        type: string

  schedule:
    # Magyar idő szerint nyáron 07:20, télen 06:20.
    # A napi adatfrissítések után futtatandó.
    - cron: "20 5 * * *"

permissions:
  contents: write

concurrency:
  group: generate-ukraine-frontline-pdf
  cancel-in-progress: false

jobs:
  generate-reports:
    name: Generate HU and EN frontline reports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab openpyxl pillow

      - name: Validate required generator
        shell: bash
        run: |
          set -euo pipefail
          test -f src/generate_daily_front_report_pdf.py
          python -m py_compile src/generate_daily_front_report_pdf.py

      - name: Generate PDF reports
        shell: bash
        env:
          INPUT_LANGUAGE: ${{ github.event.inputs.language || 'all' }}
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
        run: |
          set -euo pipefail

          CMD=(python src/generate_daily_front_report_pdf.py --lang "$INPUT_LANGUAGE")

          if [[ -n "$INPUT_REPORT_DATE" ]]; then
            CMD+=(--report-date "$INPUT_REPORT_DATE")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/reports/reports_index.json

          if [[ -f docs/reports/latest-hu.pdf ]]; then
            test "$(stat -c%s docs/reports/latest-hu.pdf)" -gt 10000
          fi

          if [[ -f docs/reports/latest-en.pdf ]]; then
            test "$(stat -c%s docs/reports/latest-en.pdf)" -gt 10000
          fi

          echo "Generated report files:"
          find docs/reports -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort

      - name: Commit and push reports
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/reports

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          REPORT_DATE="$(python - <<'PY'
          import json
          from pathlib import Path

          index_path = Path("docs/reports/reports_index.json")
          payload = json.loads(index_path.read_text(encoding="utf-8"))
          reports = payload.get("reports", [])
          print(reports[0]["date"] if reports else "unknown-date")
          PY
          )"

          git commit -m "Update Ukraine frontline PDF reports for ${REPORT_DATE}"

          # A futás közben létrejött esetleges távoli módosítások biztonságos kezelése.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload reports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-frontline-pdf-reports-${{ github.run_number }}
          path: |
            docs/reports/latest-*.pdf
            docs/reports/archive/*.pdf
            docs/reports/reports_index.json
          if-no-files-found: error
          retention-days: 14
