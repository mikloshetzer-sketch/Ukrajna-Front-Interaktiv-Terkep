name: Satellite Metadata Builder

on:
  workflow_dispatch:

  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: write

jobs:
  build-satellite-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate satellite metadata
        run: |
          python scripts/update_satellite_metadata.py

      - name: Commit satellite metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update satellite metadata"
          file_pattern: |
            docs/data/satellite/satellite-metadata.json
            docs/data/satellite/sentinel2/**
